<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome — Maznify</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-pink-50 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-lg w-full text-center">
    <div class="mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl shadow-md mb-3 bg-gradient-to-br from-indigo-500 to-pink-500 text-white font-extrabold text-3xl">M</div>
      <h1 class="text-2xl font-extrabold mb-1">Welcome to Maznify</h1>
      <p class="text-sm text-slate-500">Choose where you'd like to go after signing in</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <a href="/" class="inline-block py-3 px-4 rounded-lg bg-slate-100 text-slate-800 font-semibold hover:bg-slate-200 transition">Study Mate</a>
      <a href="/revision-desk" class="inline-block py-3 px-4 rounded-lg bg-cyan-600 text-white font-semibold hover:bg-cyan-700 transition">Revision Desk</a>
    </div>

    <div class="mt-6 text-sm text-slate-500">You can change this later from your account settings.</div>
    <div class="mt-6">
      <a href="/logout" class="text-xs text-rose-600 hover:underline">Sign out</a>
    </div>
  </div>
</body>
</html>
