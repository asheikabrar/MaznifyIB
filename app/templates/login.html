<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Maznify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl shadow-md mb-3
        bg-gradient-to-br from-indigo-500 to-pink-500 text-white font-extrabold text-3xl">M</div>
      <div class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent">Maznify</div>
      <p class="text-xs text-slate-500 mt-1">Sign in to continue</p>
    </div>
    {% if error %}
      <div class="bg-rose-50 text-rose-700 text-xs px-3 py-2 rounded mb-3">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-3" id="login-form">
      <input type="hidden" id="next-field" name="next" value="{{ next }}" />
      <label class="block">
        <span class="text-xs text-slate-600">Username</span>
        <input name="username" autofocus required autocomplete="username"
          class="mt-1 w-full border rounded px-3 py-2 text-sm" />
      </label>
      <label class="block">
        <span class="text-xs text-slate-600">Password</span>
        <input name="password" type="password" required autocomplete="current-password"
          class="mt-1 w-full border rounded px-3 py-2 text-sm" />
      </label>
      <button class="w-full bg-indigo-600 text-white rounded px-3 py-2 text-sm">Sign in</button>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="setLoginNext('/')" class="w-full bg-slate-100 text-slate-700 rounded px-3 py-2 text-sm">Study Mate</button>
        <button type="button" onclick="setLoginNext('/revision-desk')" class="w-full bg-cyan-600 text-white rounded px-3 py-2 text-sm">Revision Desk</button>
      </div>
    </form>
    <script>
      function setLoginNext(path) {
        const nextInput = document.getElementById('next-field');
        if (nextInput) {
          nextInput.value = path;
        }
        document.getElementById('login-form').submit();
      }
    </script>
    <div class="mt-4 text-center text-[11px] text-slate-400">
      Accounts are managed by your administrator.
    </div>
  </div>
</body>
</html>
